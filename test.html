<!DOCTYPE html>
<html>
<head>
    <title>PDF Bot Tester</title>
</head>
<body>
    <h2>AI PDF Bot Test</h2>
    <input type="file" id="pdfFile" accept=".pdf"><br><br>
    <button onclick="sendPDF()">PDF Bhejo</button>
    <br><br>
    <h3>Jawab:</h3>
    <div id="result" style="border:1px solid #ccc; padding:10px; min-height:100px;"></div>

    <script>
    async function sendPDF() {
        const file = document.getElementById('pdfFile').files[0];
        if (!file) { alert('Pehle PDF select karo!'); return; }
        
        document.getElementById('result').innerText = 'Processing...';
        
        const formData = new FormData();
        formData.append('data', file);
        
        const response = await fetch('http://localhost:5678/webhook-test/pdf-bot', {
            method: 'POST',
            body: formData
        });
        
        const text = await response.text();
        document.getElementById('result').innerText = text;
    }
    </script>
</body>
</html>
